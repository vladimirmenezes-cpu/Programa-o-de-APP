<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="logo">🔢</div>
        <h1>Matemágica Básica</h1>

        <label for="num1">Número 1</label>
        <input type="number" id="num1" placeholder="Digite o primeiro número">
        
        <label for="num2">Número 2</label>
        <input type="number" id="num2" placeholder="Digite o segundo número">

        <p class="label-calculos">Quais cálculos deseja ver?</p>
        <div class="checkboxes">
            <label><input type="checkbox" id="chkMedia">    📊 Média</label>
            <label><input type="checkbox" id="chkSoma">     ➕ Soma</label>
            <label><input type="checkbox" id="chkProduto">  ✖️ Produto</label>
            <label><input type="checkbox" id="chkMaior">    ⬆️ Maior</label>
            <label><input type="checkbox" id="chkMenor">    ⬇️ Menor</label>
        </div>

        <button onclick="calcular()">Calcular</button>

        <div id="resultados" class="resultados hidden"></div>

    </div>
    <script src="script.js"></script>
</body>
</html>
