<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Aposentadoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Verificação de Aposentadoria</h2>
        <div class="form-group">
            <label>Matrícula (Código):</label>
            <input type="text" id="matricula" placeholder="Ex: 12345">
        </div>
        <div class="form-group">
            <label>Ano de Nascimento:</label>
            <input type="number" id="anoNasc" placeholder="Ex: 1958">
        </div>
        <div class="form-group">
            <label>Tempo de Trabalho (anos):</label>
            <input type="number" id="tempoTrab" placeholder="Ex: 30">
        </div>
        <button onclick="verificarAposentadoria()">Verificar Status</button>

        <div id="resultado" class="result-box" style="display: none;">
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
