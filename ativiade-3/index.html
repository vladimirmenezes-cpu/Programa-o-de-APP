<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovado/Reprovado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="logo">🎓</div>
        <h1>Calculadora de Média Escolar</h1>

        <div class="field">
            <label for="n1">Nota 1</label>
            <input type="number" id="n1" placeholder="0 – 10">
        </div>

        <div class="field">
            <label for="n2">Nota 2</label>
            <input type="number" id="n2" placeholder="0 – 10">
        </div>

        <div class="field">
            <label for="n3">Nota 3</label>
            <input type="number" id="n3" placeholder="0 – 10">
        </div>

        <button onclick="calcular()">Calcular média</button>

        <div class="result-box" id="resultados">
            <div class="metric">
                <span>Média final</span>
                <strong id="mediaVal">—</strong>
            </div>
            <div class="situacao">
                <span>Situação</span>
                <span id="badge"></span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
