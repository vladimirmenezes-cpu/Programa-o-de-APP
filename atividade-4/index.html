<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Devo Votar?</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>🗳️ Devo Votar?</h1>
  <p class="subtitulo">Descubra sua situação eleitoral pelo Brasil</p>

  <div class="card">
    <label for="idade">Digite sua idade:</label>
    <input type="number" id="idade" placeholder="Ex: 17" min="0" max="120" />
    <button onclick="verificar()">Verificar</button>
    <div id="resultado"></div>
  </div>

  <div class="regras">
    <h2>Regras eleitorais</h2>

    <div class="regra-item">
      <div class="bolinha" style="background:#e74c3c"></div>
      <span>Menor de 16 anos — <strong>não pode votar</strong></span>
    </div>

    <div class="regra-item">
      <div class="bolinha" style="background:#f1c40f"></div>
      <span>16 ou 17 anos — <strong>voto opcional</strong></span>
    </div>

    <div class="regra-item">
      <div class="bolinha" style="background:#2ecc71"></div>
      <span>18 a 65 anos — <strong>voto obrigatório</strong></span>
    </div>

    <div class="regra-item">
      <div class="bolinha" style="background:#f1c40f"></div>
      <span>Acima de 65 anos — <strong>voto opcional</strong></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
